<!-- One page of a post's comments - rendered by forum.views.forum_comments_view
     and fetched/appended by the comment section script in
     templates/forum/index.html. Never rendered as a full page. -->
{% for c in comments %}
<div class="comment-item" id="comment-{{ c.id }}">
  <div class="comment-meta">
    {% if c.author.profile_picture %}<img src="{{ c.author.profile_picture.url }}" alt="" class="comment-avatar">{% endif %}
    <span class="comment-author">{{ c.author.username }}</span>
    <span class="comment-date">{{ c.created_at|date:"m/d/Y g:i A" }}</span>
    {% if can_delete_comments %}
      <button type="button" class="comment-delete-btn" data-comment="{{ c.id }}" data-post="{{ post_id }}" title="Delete comment">[ DELETE ]</button>
    {% endif %}
  </div>
  <div class="comment-body">{{ c.body|safe }}</div>
</div>
{% endfor %}
{% if has_more %}
<button type="button" class="comment-load-more" data-post="{{ post_id }}" data-offset="{{ next_offset }}">[ + ] Load 5 more</button>
{% endif %}
