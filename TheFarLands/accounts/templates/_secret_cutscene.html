<!-- "C1" - the secret "breach" cutscene, a site-wide easter egg, not tied
     to Mail (see mail/templates/mail/index.html's separate, unrelated
     boot-up terminal, which isn't numbered). Included from both
     base.html and home.html (which doesn't extend base.html), same
     pattern as _nav_mail_icons.html, so this is fully self-contained.

     Two ways it plays:
       - Automatically: a 1-in-100 roll every time the browser tab
         regains visibility (switched back to).
       - On demand, Director only: typing the literal string "!cmd_C1"
         into ANY text field or textarea anywhere on the site.
     Gated to signed-in accounts with CustomUser.secret_cutscene_enabled
     True (Settings tab, Cutscenes sub-tab) - off means neither trigger
     above ever plays for that account, the cheat code included. -->
{% if user.is_authenticated and user.secret_cutscene_enabled %}
<style>
  .sc-overlay {
    position: fixed;
    inset: 0;
    z-index: 10050;
    background: var(--deep-black);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    opacity: 1;
  }
  .sc-overlay.sc-active { display: flex; }
  .sc-overlay.sc-fade { opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }
  .sc-box {
    font-family: 'Share Tech Mono', monospace;
    color: var(--red-bright);
    text-shadow: 0 0 8px var(--red), 0 0 16px var(--red-dim);
    max-width: 640px;
    width: 100%;
    text-align: center;
  }
  .sc-lines div { margin-bottom: 0.4rem; font-size: 1.5rem; letter-spacing: 1px; }
  /* Code-flood takeover - fixed/full-viewport (escapes .sc-box's centered
     layout regardless of DOM nesting) so it reads as the terminal
     swallowing the whole page, not a bounded panel. Hidden by default;
     .sc-dump-active is added only while the flood plays, then removed
     instantly (no transition) for the "disappears suddenly" cut into
     Clearing Breach. */
  .sc-dump {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10060;
    background: var(--deep-black);
    overflow: hidden;
    padding: 1.2rem;
    /* Overrides .sc-box's inherited text-align: center (.sc-dump is a DOM
       child of .sc-box even though position:fixed pulls it out of the
       visual flow) - the code flood reads left-to-right from the left
       edge, not centered, unlike the header/clearing/final text. */
    text-align: left;
  }
  .sc-dump.sc-dump-active { display: block; }
  .sc-dump div { font-size: 0.78rem; line-height: 1.5; color: var(--dim-white); opacity: 0.85; letter-spacing: 0.5px; text-shadow: none; }
  .sc-clearing, .sc-final {
    margin-top: 0.8rem;
    font-size: 1.5rem;
    color: #33ff5b;
    text-shadow: 0 0 8px #33ff5b, 0 0 20px #0e6621;
  }
</style>
<div id="sc-overlay" class="sc-overlay">
  <div class="sc-box">
    <div id="sc-lines" class="sc-lines"></div>
    <div id="sc-dump" class="sc-dump"></div>
    <div id="sc-clearing" class="sc-clearing" style="display:none;"></div>
    <div id="sc-final" class="sc-final" style="display:none;"></div>
  </div>
</div>
<script>
  (function () {
    var overlay = document.getElementById('sc-overlay');
    if (!overlay) return;
    var linesEl = document.getElementById('sc-lines');
    var dumpEl = document.getElementById('sc-dump');
    var clearingEl = document.getElementById('sc-clearing');
    var finalEl = document.getElementById('sc-final');
    var userRole = '{{ user.role|default:"Agent" }}';

    // Lore flavor text for the "breach" dump - agents/hackers chasing
    // The Truth, rumors of a King, the Creator, factions, brainwashed
    // militias, corruption. A random subset plays each time, shuffled,
    // so no two breaches read quite the same.
    var LORE_LINES = [
      '[AGENT-004] still searching for The Truth...',
      '[HACKER-119] intercepted: "the Truth is not what they tell you"',
      'rumor log: a King rules above the Director - unconfirmed',
      'archive fragment: "the Creator built this place, then vanished"',
      'faction report: Obsidian Circle vs. Ashen Guard, active',
      'militia unit 7 flagged for brainwashing protocol',
      'corruption detected in Admin ledger, root cause unknown',
      'signal: "they are not who they say they are"',
      'tracing the King\'s bloodline... incomplete',
      'hacker collective F.R.E.D. still active, still watching',
      'agents dispatched to locate the Creator\'s first Directive',
      'militia recruits reporting memory gaps after induction',
      'faction Ashen Guard denies all militia involvement',
      'corruption index climbing in Sector 9',
      'unverified: the King and the Creator are the same person',
      'agents warned: The Truth is fragmented across 7 accounts',
      'hacker broadcast jammed mid-transmission',
      'Director override attempted... access denied',
    ];

    var playing = false;
    var shuffle = window.TFL_Cutscene.shuffle;
    var typeAnimatedLine = window.TFL_Cutscene.typeAnimatedLine;

    function play() {
      if (playing) return;
      playing = true;
      linesEl.innerHTML = '';
      dumpEl.innerHTML = '';
      clearingEl.style.display = 'none';
      clearingEl.textContent = '';
      finalEl.style.display = 'none';
      finalEl.textContent = '';
      overlay.classList.remove('sc-fade');
      overlay.classList.add('sc-active');

      var header = ['loading ...', '>/Directive_exe ...', '^Transmission message ...', ':"I am always watching."'];
      var headerIndex = 0;

      function nextHeaderLine() {
        if (headerIndex >= header.length) {
          setTimeout(runDump, 500);
          return;
        }
        var lineEl = document.createElement('div');
        linesEl.appendChild(lineEl);
        typeAnimatedLine(lineEl, header[headerIndex], function () {
          headerIndex++;
          setTimeout(nextHeaderLine, 350);
        });
      }

      // Floods the ENTIRE page with scrolling code (see .sc-dump's
      // fixed/full-viewport CSS) - cycles through a reshuffled LORE_LINES
      // repeatedly rather than just 10 lines, so it actually fills and
      // keeps filling the screen like a real terminal takeover, not a
      // small bounded panel.
      function runDump() {
        dumpEl.innerHTML = '';
        dumpEl.classList.add('sc-dump-active');
        var TOTAL_LINES = 90;
        var pool = shuffle(LORE_LINES);
        var poolIndex = 0;
        var i = 0;
        var tick = setInterval(function () {
          if (i >= TOTAL_LINES) {
            clearInterval(tick);
            cutToClearing();
            return;
          }
          if (poolIndex >= pool.length) {
            pool = shuffle(LORE_LINES);
            poolIndex = 0;
          }
          var row = document.createElement('div');
          row.textContent = pool[poolIndex];
          poolIndex++;
          dumpEl.appendChild(row);
          dumpEl.scrollTop = dumpEl.scrollHeight;
          i++;
        }, 40);
      }

      // The whole flood (and the header text sitting underneath it)
      // vanishes at once, instantly - no fade - right before Clearing
      // Breach appears.
      function cutToClearing() {
        dumpEl.classList.remove('sc-dump-active');
        dumpEl.innerHTML = '';
        linesEl.innerHTML = '';
        runClearing();
      }

      function runClearing() {
        clearingEl.style.display = 'block';
        typeAnimatedLine(clearingEl, '<Clearing Breach ...>', function () {
          setTimeout(runFinal, 500);
        });
      }

      function runFinal() {
        finalEl.style.display = 'block';
        typeAnimatedLine(finalEl, '{All cleared! proceed (' + userRole + ')}', function () {
          setTimeout(function () {
            overlay.classList.add('sc-fade');
            setTimeout(function () {
              overlay.classList.remove('sc-active', 'sc-fade');
              playing = false;
            }, 500);
          }, 1200);
        });
      }

      nextHeaderLine();
    }

    // Trigger 1: switching back to this browser tab is a 1/100 roll.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && Math.random() < 0.01) {
        play();
      }
    });

    {% if user.is_director %}
    // Trigger 2: Director-only cheat code, typed into ANY text field or
    // textarea anywhere on the site (mail compose, bio, report reason,
    // a username search, ...) - bypasses the 1/100 roll entirely.
    var CMD_TRIGGER = '!cmd_C1';
    var TEXT_INPUT_TYPES = ['text', 'search', 'email', 'url', ''];
    document.addEventListener('input', function (e) {
      var el = e.target;
      var isTextField = el.tagName === 'TEXTAREA'
        || (el.tagName === 'INPUT' && TEXT_INPUT_TYPES.indexOf(el.type) !== -1);
      if (!isTextField) return;
      if (el.value === CMD_TRIGGER) {
        el.value = '';
        play();
      }
    });
    {% endif %}
  })();
</script>
{% endif %}
