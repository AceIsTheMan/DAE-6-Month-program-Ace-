<!-- Secret "breach" cutscene - a site-wide easter egg, not tied to Mail
     (see mail/templates/mail/index.html's separate, unrelated boot-up
     terminal). Included from both base.html and home.html (which doesn't
     extend base.html), same pattern as _nav_mail_icons.html, so this is
     fully self-contained.

     Two ways it plays:
       - Automatically: a 1-in-100 roll every time the browser tab
         regains visibility (switched back to).
       - On demand, Director only: typing the literal string "!cmd_C1"
         into ANY text field or textarea anywhere on the site.
     Gated to signed-in accounts only - the final line needs a real role
     to show. -->
{% if user.is_authenticated %}
<style>
  .sc-overlay {
    position: fixed;
    inset: 0;
    z-index: 10050;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    opacity: 1;
  }
  .sc-overlay.sc-active { display: flex; }
  .sc-overlay.sc-fade { opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }
  .sc-box {
    font-family: 'Share Tech Mono', monospace;
    color: var(--red-bright);
    text-shadow: 0 0 8px var(--red), 0 0 16px var(--red-dim);
    max-width: 640px;
    width: 100%;
  }
  .sc-lines div { margin-bottom: 0.35rem; font-size: 1.1rem; letter-spacing: 1px; }
  .sc-dump {
    margin-top: 0.9rem;
    max-height: 220px;
    overflow: hidden;
    border-top: 1px dashed var(--red-dim);
    border-bottom: 1px dashed var(--red-dim);
    padding: 0.6rem 0;
  }
  .sc-dump div { font-size: 0.72rem; color: var(--dim-white); opacity: 0.85; letter-spacing: 0.5px; margin-bottom: 0.25rem; text-shadow: none; }
  .sc-clearing, .sc-final {
    margin-top: 0.8rem;
    font-size: 1.1rem;
    color: #33ff5b;
    text-shadow: 0 0 8px #33ff5b, 0 0 20px #0e6621;
  }
</style>
<div id="sc-overlay" class="sc-overlay">
  <div class="sc-box">
    <div id="sc-lines" class="sc-lines"></div>
    <div id="sc-dump" class="sc-dump"></div>
    <div id="sc-clearing" class="sc-clearing" style="display:none;"></div>
    <div id="sc-final" class="sc-final" style="display:none;"></div>
  </div>
</div>
<script>
  (function () {
    var overlay = document.getElementById('sc-overlay');
    if (!overlay) return;
    var linesEl = document.getElementById('sc-lines');
    var dumpEl = document.getElementById('sc-dump');
    var clearingEl = document.getElementById('sc-clearing');
    var finalEl = document.getElementById('sc-final');
    var userRole = '{{ user.role|default:"Agent" }}';

    // Lore flavor text for the "breach" dump - agents/hackers chasing
    // The Truth, rumors of a King, the Creator, factions, brainwashed
    // militias, corruption. A random subset plays each time, shuffled,
    // so no two breaches read quite the same.
    var LORE_LINES = [
      '[AGENT-004] still searching for The Truth...',
      '[HACKER-119] intercepted: "the Truth is not what they tell you"',
      'rumor log: a King rules above the Director - unconfirmed',
      'archive fragment: "the Creator built this place, then vanished"',
      'faction report: Obsidian Circle vs. Ashen Guard, active',
      'militia unit 7 flagged for brainwashing protocol',
      'corruption detected in Admin ledger, root cause unknown',
      'signal: "they are not who they say they are"',
      'tracing the King\'s bloodline... incomplete',
      'hacker collective F.R.E.D. still active, still watching',
      'agents dispatched to locate the Creator\'s first Directive',
      'militia recruits reporting memory gaps after induction',
      'faction Ashen Guard denies all militia involvement',
      'corruption index climbing in Sector 9',
      'unverified: the King and the Creator are the same person',
      'agents warned: The Truth is fragmented across 7 accounts',
      'hacker broadcast jammed mid-transmission',
      'Director override attempted... access denied',
    ];

    var playing = false;

    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
      }
      return a;
    }

    function typeLine(el, text, delay, done) {
      el.textContent = '';
      var i = 0;
      (function next() {
        if (i < text.length) {
          el.textContent += text[i];
          i++;
          setTimeout(next, delay);
        } else if (done) {
          done();
        }
      })();
    }

    function play() {
      if (playing) return;
      playing = true;
      linesEl.innerHTML = '';
      dumpEl.innerHTML = '';
      clearingEl.style.display = 'none';
      clearingEl.textContent = '';
      finalEl.style.display = 'none';
      finalEl.textContent = '';
      overlay.classList.remove('sc-fade');
      overlay.classList.add('sc-active');

      var header = ['loading ...', '>/Directive_exe ...', '^Transmission message ...', ':"I am always watching."'];
      var headerIndex = 0;

      function nextHeaderLine() {
        if (headerIndex >= header.length) {
          setTimeout(runDump, 500);
          return;
        }
        var lineEl = document.createElement('div');
        linesEl.appendChild(lineEl);
        typeLine(lineEl, header[headerIndex], 30, function () {
          headerIndex++;
          setTimeout(nextHeaderLine, 350);
        });
      }

      function runDump() {
        var picks = shuffle(LORE_LINES).slice(0, 10);
        var i = 0;
        var tick = setInterval(function () {
          if (i >= picks.length) {
            clearInterval(tick);
            setTimeout(runClearing, 500);
            return;
          }
          var row = document.createElement('div');
          row.textContent = picks[i];
          dumpEl.appendChild(row);
          dumpEl.scrollTop = dumpEl.scrollHeight;
          i++;
        }, 160);
      }

      function runClearing() {
        clearingEl.style.display = 'block';
        typeLine(clearingEl, '<Clearing Breach ...>', 30, function () {
          setTimeout(runFinal, 500);
        });
      }

      function runFinal() {
        finalEl.style.display = 'block';
        typeLine(finalEl, '{All cleared! proceed (' + userRole + ')}', 25, function () {
          setTimeout(function () {
            overlay.classList.add('sc-fade');
            setTimeout(function () {
              overlay.classList.remove('sc-active', 'sc-fade');
              playing = false;
            }, 500);
          }, 1200);
        });
      }

      nextHeaderLine();
    }

    // Trigger 1: switching back to this browser tab is a 1/100 roll.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && Math.random() < 0.01) {
        play();
      }
    });

    {% if user.is_director %}
    // Trigger 2: Director-only cheat code, typed into ANY text field or
    // textarea anywhere on the site (mail compose, bio, report reason,
    // a username search, ...) - bypasses the 1/100 roll entirely.
    var CMD_TRIGGER = '!cmd_C1';
    var TEXT_INPUT_TYPES = ['text', 'search', 'email', 'url', ''];
    document.addEventListener('input', function (e) {
      var el = e.target;
      var isTextField = el.tagName === 'TEXTAREA'
        || (el.tagName === 'INPUT' && TEXT_INPUT_TYPES.indexOf(el.type) !== -1);
      if (!isTextField) return;
      if (el.value === CMD_TRIGGER) {
        el.value = '';
        play();
      }
    });
    {% endif %}
  })();
</script>
{% endif %}
