<!DOCTYPE html>
<html lang="en">
<head>
    <meta charest="UFT-8">
    <title>Django Site with Background Music</title>
   <!-- Link the custom CSS -->
    <link rel="stylesheet" href="{% static 'css/stye.css' %}"
</head>
<body>

    <!-- welcomie overlay for interactions so music can play -->
     <div id="welcome-overlay" class="overlay">
        <div class=""overlay-content>
            <h1>Welcome to My Practice Site</h1>
            <button id="start-btn">Enter Site & Play Songs</button>
        </div>
     </div>
    
     <!-- Hidden Container for the Youtube Player -->
     <div id="yt-audio-contianer" style="position: absolute; top: -9999px;">
        <div id="player"></div>
     </div>

     <!-- Pass Django context cleanly into a JavaScript safe format -->
    {{ youtube_video_id|json_script:"yt-video-id" }}

     <!-- Load Youtube IFrame Player API -->
      <script src="https:/youtube.com"></script>
      <!-- Link your custom JS -->
       <script src="{% static 'js/music.js' %}"></script>

       <!-- Settings Dashboard Widget -->
<div id="settings-panel" class="settings-box">
    <h3>Audio Settings</h3>
    <label class="switch-container">
        <span>Background Music</span>
        <input type="checkbox" id="music-toggle" checked>
        <span class="slider"></span>
    </label>
</div>

</body>
</html>
