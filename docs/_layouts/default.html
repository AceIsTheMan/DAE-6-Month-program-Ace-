<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="banner banner-top" role="presentation" aria-hidden="true"></header>

  <div class="site-nav">
    <div class="site-nav-inner">
      <a class="dae-brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/images/dae_logo_color.jpeg' | relative_url }}" alt="dae logo">
      </a>

      <nav class="portfolio-nav" aria-label="Portfolio navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/about.html' | relative_url }}">About</a>
        <a href="{{ '/projects.html' | relative_url }}">Projects</a>
        <a href="{{ '/contact.html' | relative_url }}">Contact</a>
      </nav>

      <a class="btn-github" href="https://github.com/AceIsTheMan" target="_blank" rel="noopener">View GitHub</a>
    </div>
  </div>

  <main class="page">
    {{ content }}
  </main>

  <footer class="banner banner-bottom" role="presentation" aria-hidden="true"></footer>

  <script>
    (function () {
      var top = document.querySelector('.banner-top');
      var bottom = document.querySelector('.banner-bottom');

      // Top banner: fades out as the page scrolls past it.
      function onScroll() {
        if (!top) return;
        var distance = top.offsetHeight || 1;
        var fade = 1 - (window.scrollY / distance);
        top.style.opacity = Math.max(0, Math.min(1, fade));
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();

      // Bottom banner: fades in once it scrolls into view near the bottom of the page.
      if (bottom && 'IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            bottom.style.opacity = entry.isIntersecting ? 1 : 0;
          });
        }, { threshold: 0.15 });
        io.observe(bottom);
      } else if (bottom) {
        bottom.style.opacity = 1;
      }
    })();
  </script>
</body>
</html>
